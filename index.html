<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>InkAction — AI-First Stylus Ink to Actions</title>
  <meta name="description" content="AI-first digital ink notepad for Samsung Galaxy S-Pen and stylus devices. Automatically transforms handwriting into structured notes, checklists, and calendar events with Google Gemini.">
  <meta name="theme-color" content="#0d1117">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/actions.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="logo-badge">🖋️</div>
        <h1 class="brand-title">
          InkAction
          <span class="brand-tag">S-Pen AI</span>
        </h1>
      </div>

      <!-- Mobile / Phone View Switcher (Galaxy S26 Ultra) -->
      <div class="view-tabs" role="tablist">
        <button class="view-tab-btn active" data-view="canvas" id="btn-view-canvas">Pen Canvas</button>
        <button class="view-tab-btn" data-view="actions" id="btn-view-actions">Action Hub</button>
      </div>

      <div class="header-actions">
        <button class="btn btn-icon" id="btn-theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button class="btn" id="btn-open-settings" title="Settings & Gemini API" aria-label="Open Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Settings
        </button>
      </div>
    </header>

    <!-- Main Workspace (Dual Pane for Galaxy Tab S9, Tabbed for S26 Ultra) -->
    <main class="workspace-container" id="workspace" data-active-view="canvas">
      
      <!-- Left / Top: Pen Drawing Canvas -->
      <section class="pane canvas-pane">
        <div class="canvas-wrapper">
          
          <!-- Floating Pen Toolbar -->
          <div class="canvas-floating-toolbar" role="toolbar" aria-label="Drawing Tools">
            <!-- Tool selection -->
            <div class="tool-group">
              <button class="tool-btn active" data-tool="pen" title="Fine Pen (Pressure sensitive)" aria-label="Pen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
              </button>
              <button class="tool-btn" data-tool="highlighter" title="Highlighter" aria-label="Highlighter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"></path><path d="m22 2-5 5-4-4 5-5a2.83 2.83 0 0 1 4 4z"></path></svg>
              </button>
              <button class="tool-btn" data-tool="eraser" title="Eraser" aria-label="Eraser">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path><path d="M22 21H7"></path><path d="m5 11 9 9"></path></svg>
              </button>
            </div>

            <!-- Color swatches -->
            <div class="color-swatch-picker">
              <span class="color-dot active" data-color="#f0f6fc" style="background-color: #f0f6fc;" title="White / Ink"></span>
              <span class="color-dot" data-color="#58a6ff" style="background-color: #58a6ff;" title="Blue"></span>
              <span class="color-dot" data-color="#3fb950" style="background-color: #3fb950;" title="Green"></span>
              <span class="color-dot" data-color="#d29922" style="background-color: #d29922;" title="Amber"></span>
              <span class="color-dot" data-color="#f85149" style="background-color: #f85149;" title="Coral"></span>
              <span class="color-dot" data-color="#bc8cff" style="background-color: #bc8cff;" title="Purple"></span>
            </div>

            <!-- Undo / Redo / Clear -->
            <div class="tool-group">
              <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
              </button>
              <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
              </button>
              <button class="tool-btn" id="btn-clear" title="Clear Canvas" aria-label="Clear Canvas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          </div>

          <!-- HTML5 Stylus Canvas -->
          <canvas id="ink-canvas"></canvas>

          <!-- Bottom Status & Auto-Push Engine Bar -->
          <div class="canvas-bottom-bar">
            <div class="bottom-left-info">
              <div class="autopush-pill" id="autopush-pill">
                <div class="autopush-ring">
                  <svg>
                    <circle class="bg-circle" cx="9" cy="9" r="8"></circle>
                    <circle class="progress-circle" id="progress-circle" cx="9" cy="9" r="8"></circle>
                  </svg>
                </div>
                <span id="autopush-text">Auto-push on finish</span>
              </div>
              <div class="stylus-indicator" id="stylus-status">
                <span class="stylus-dot"></span>
                <span>S-Pen Ready</span>
              </div>
            </div>

            <div class="bottom-right-actions">
              <button class="btn-push-action" id="btn-push-action" title="Immediately process with AI Agents">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                <span>Actionize Now</span>
              </button>
            </div>
          </div>

        </div>
      </section>

      <!-- Right / Bottom: AI Multi-Agent Action Hub -->
      <section class="pane actions-pane" id="actions-pane">
        <!-- Rendered dynamically by ActionHub.js -->
      </section>

    </main>

    <!-- Settings Modal -->
    <div class="modal-backdrop" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-card">
        <div class="modal-header">
          <h2 class="modal-title" id="settings-title">InkAction Settings</h2>
          <button class="btn btn-icon" id="btn-close-settings" aria-label="Close Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-api-key">Google Gemini API Key</label>
          <input type="password" class="form-input" id="input-api-key" placeholder="AIzaSy...">
          <div class="form-help">Your API key is stored securely in local browser storage. Leave empty to use instant demo mode.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="select-model">Gemini Model</label>
          <select class="form-select" id="select-model">
            <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fastest multimodal transcription)</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash (Next-gen reasoning)</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deep complex diagram analysis)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="select-debounce">"Done Writing" Auto-Push Delay</label>
          <select class="form-select" id="select-debounce">
            <option value="4000">4 seconds idle</option>
            <option value="6000" selected>6 seconds idle (Recommended)</option>
            <option value="8000">8 seconds idle</option>
            <option value="12000">12 seconds idle</option>
            <option value="0">Manual push only (Disabled)</option>
          </select>
          <div class="form-help">How long InkAction waits after your last stroke before sending your note to Google AI.</div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
          <button class="btn btn-primary" id="btn-save-settings">Save & Apply</button>
        </div>
      </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
